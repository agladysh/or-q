suite: _RAW

tests:
  - name: smoke-simplest
    argv: |
      _RAW '{"_RAW": ["echo","it works"]}'
    stdin: 'ignored'
    exit: 0
    stdout: '"it works"'

  - name: smoke-in-key
    argv: |
      _RAW '{"a": {"_RAW": ["echo","it works"]}}' yaml
    stdin: 'ignored'
    exit: 0
    stdout: | # yaml
      a: it works

  - name: regression-gemini
    argv: exec-input yaml
    stdin: | # yaml
      - _JSON:
         method: POST
         headers:
           x-goog-api-key:
             _RAW: [echo: GEMINI_API_KEY]
           Content-Type: application/json
         body:
           generationConfig:
             temperature: 0
           system_instruction:
             parts:
               - text:
                   _RAW: [echo: 1]
           contents:
             - role: user
               parts:
                 - text:
                     _RAW: [echo: 2]
    stdout: | # yaml
      method: POST
      headers:
        x-goog-api-key: GEMINI_API_KEY
        Content-Type: application/json
      body:
        generationConfig:
          temperature: 0
        system_instruction:
          parts:
            - text: "1"
        contents:
          - role: user
            parts:
              - text: "2"
