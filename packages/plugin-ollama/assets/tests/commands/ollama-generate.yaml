# Testing ollama-generate command
# Note: This test expects model not found error from Ollama server
suite: ollama-generate

tests:
  - name: smoke
    argv:
      - echo
      - '{"model": "gpt-oss:20b", "prompt": "Hello"}'
      - ollama-generate
    stdin: ''
    # Test expects model not found error
    stdout:
      - contains: 'model'
